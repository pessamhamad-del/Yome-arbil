<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بیرمەند - Birmand AI</title>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzYS4A2Eu8QiZ2rJa1NWmsqMxw88KuNHA",
      authDomain: "birmand-ai.firebaseapp.com",
      projectId: "birmand-ai",
      storageBucket: "birmand-ai.firebasestorage.app",
      messagingSenderId: "117037801703",
      appId: "1:117037801703:web:5482a3643b262cce868242",
      measurementId: "G-GNQVGSN6Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fsOps = { collection, doc, setDoc, onSnapshot, serverTimestamp };
  </script>

  <!-- Google Fonts: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-input: #1b263b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --msg-user: #1d4ed8;
      --msg-ai: #1e293b;
      --border: #1e293b;
      --online: #10b981;
      --offline: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #auth-screen {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .card h2 {
      font-weight: 800;
      margin-bottom: 8px;
      color: #fff;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: right;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }

    .user-info h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .user-info span {
      font-size: 0.75rem;
      color: var(--online);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-info span::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--online);
      border-radius: 50%;
    }

    .admin-link-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      position: relative;
      word-wrap: break-word;
    }

    .msg-user {
      align-self: flex-start;
      background: var(--msg-user);
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .msg-ai {
      align-self: flex-end;
      background: var(--msg-ai);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-bottom-right-radius: 4px;
    }

    .msg-img {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 8px;
      display: block;
    }

    .input-bar-container {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preview-box {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-input);
      border-radius: 8px;
      width: fit-content;
    }

    .preview-box img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }

    .preview-box button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .tool-btn.recording {
      background: #ef4444;
      color: #fff;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .chat-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    #admin-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.97);
      backdrop-filter: blur(14px);
      z-index: 200;
      padding: 20px;
      overflow-y: auto;
    }

    .admin-container {
      max-width: 650px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-input);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-card h4 {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .stat-card p {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-top: 4px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .user-status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-online { background-color: var(--online); }
    .status-offline { background-color: var(--offline); }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="card">
      <h2>بەخێربێیت بۆ بیرمەند ⚡</h2>
      <p>ناوەکەت بنووسە بۆ دەستپێکردن</p>
      <div class="form-group">
        <label>ناوت دیاری بکە</label>
        <input type="text" id="reg-name" class="form-input" placeholder="وەک: کاردۆ، ئارام...">
      </div>
      <button class="btn-main" id="btn-enter">چوونە ژوورەوە</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-panel">
    <div class="admin-container">
      <div class="admin-header">
        <h3>داشبۆردی بەڕێوەبەر 📊</h3>
        <button class="admin-link-btn" id="btn-close-admin">داخستن ✕</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h4>کۆی بەکارهێنەران</h4>
          <p id="stat-total">٠</p>
        </div>
        <div class="stat-card">
          <h4>ئێستا ئۆنلاینن</h4>
          <p id="stat-online" style="color: var(--online);">٠</p>
        </div>
      </div>

      <h4 style="margin-bottom: 10px;">لیستی بەکارهێنەران:</h4>
      <div class="user-list" id="users-container"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <header>
    <div class="header-user">
      <div class="avatar">ب</div>
      <div class="user-info">
        <h3>بیرمەند (Birmand)</h3>
        <span>چالاکە و لەسەر هێڵە</span>
      </div>
    </div>
    <button class="admin-link-btn" id="btn-open-admin">بەشی بەڕێوەبەر 🔒</button>
  </header>

  <div id="chat-box">
    <div class="message msg-ai">
      سڵاو، ئەمن بیرمەندم بەخێربێیت خوارزا، خزمەتت دەکەم. بڵێ، چیت دەوێ، ئەمر بکە؟
    </div>
  </div>

  <div class="input-bar-container">
    <div class="preview-box" id="preview-box">
      <img id="img-preview" src="">
      <button id="btn-remove-img">✕</button>
    </div>

    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <button class="tool-btn" id="btn-upload" title="ناردنی وێنە">📷</button>
      <button class="tool-btn" id="btn-mic" title="تۆمارکردنی دەنگ">🎙️</button>
      
      <input type="text" id="chat-input" class="chat-input" placeholder="پەیامەکەت لێرە بنووسە..." autocomplete="off">
      <button class="send-btn" id="btn-send">➤</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6JamrCv2LzMwceLz4r4n4702bASzIaXiPiHcVNuc8KVQw";
    let currentUser = null;
    let base64Image = null;
    let isRecording = false;
    let recognition = null;

    const chatBox = document.getElementById("chat-box");
    const chatInput = document.getElementById("chat-input");
    const previewBox = document.getElementById("preview-box");
    const imgPreview = document.getElementById("img-preview");

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Voice recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'ckb-IQ';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        stopVoiceRecording();
      };

      recognition.onerror = () => stopVoiceRecording();
      recognition.onend = () => stopVoiceRecording();
    }

    function stopVoiceRecording() {
      isRecording = false;
      document.getElementById("btn-mic").classList.remove("recording");
    }

    document.getElementById("btn-mic").addEventListener("click", () => {
      if (!recognition) {
        alert("تایبەتمەندی دەنگ لەم وێبگەڕەدا پشتیوانی ناکرێت.");
        return;
      }
      if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById("btn-mic").classList.add("recording");
      } else {
        recognition.stop();
        stopVoiceRecording();
      }
    });

    // Image preview & upload
    document.getElementById("btn-upload").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          base64Image = reader.result.split(',')[1];
          imgPreview.src = reader.result;
          previewBox.style.display = "flex";
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById("btn-remove-img").addEventListener("click", () => {
      base64Image = null;
      document.getElementById("file-input").value = "";
      previewBox.style.display = "none";
    });

    // Registration & Online presence
    document.getElementById("btn-enter").addEventListener("click", async () => {
      const name = document.getElementById("reg-name").value.trim();
      if (!name) return;

      currentUser = {
        name: name,
        id: "user_" + Math.random().toString(36).substring(2, 9),
        joinedAt: new Date().toISOString()
      };

      document.getElementById("auth-screen").style.display = "none";

      if (window.db) {
        const { doc, setDoc, serverTimestamp } = window.fsOps;
        const userRef = doc(window.db, "users", currentUser.id);
        
        await setDoc(userRef, {
          name: currentUser.name,
          status: "online",
          lastSeen: serverTimestamp()
        }, { merge: true });

        window.addEventListener("beforeunload", () => {
          setDoc(userRef, { status: "offline", lastSeen: serverTimestamp() }, { merge: true });
        });
      }
    });

    // Admin dashboard modal
    document.getElementById("btn-open-admin").addEventListener("click", () => {
      const pass = prompt("تێپەڕەوشەی بەڕێوەبەر (Admin Password) بنووسە:");
      if (pass === "123456") {
        document.getElementById("admin-panel").style.display = "block";
        loadAdminStats();
      } else if (pass !== null) {
        alert("تێپەڕەوشە هەڵەیە!");
      }
    });

    document.getElementById("btn-close-admin").addEventListener("click", () => {
      document.getElementById("admin-panel").style.display = "none";
    });

    function loadAdminStats() {
      if (!window.db) return;
      const { collection, onSnapshot } = window.fsOps;
      
      onSnapshot(collection(window.db, "users"), (snapshot) => {
        let total = 0;
        let online = 0;
        const container = document.getElementById("users-container");
        container.innerHTML = "";

        snapshot.forEach((docSnap) => {
          total++;
          const data = docSnap.data();
          const isOnline = data.status === "online";
          if (isOnline) online++;

          const row = document.createElement("div");
          row.className = "user-row";
          row.innerHTML = `
            <span>${data.name || 'بەکارهێنەر'}</span>
            <span style="display:flex; align-items:center; gap:6px;">
              <span class="user-status ${isOnline ? 'status-online' : 'status-offline'}"></span>
              <small style="color:var(--text-dim);">${isOnline ? 'لەسەر هێڵە' : 'دەرچووە'}</small>
            </span>
          `;
          container.appendChild(row);
        });

        document.getElementById("stat-total").innerText = total;
        document.getElementById("stat-online").innerText = online;
      });
    }

    // Direct Gemini integration with Google Search
    async function askGemini(promptText, imgData) {
      const systemInstruction = `
تۆ ناوت "بیرمەند"ە (Birmand). وەڵامەکانت بە شێوەزاری کوردیی پاراو و گەرموگوڕ (تێکەڵەی هەولێری و سۆرانی بازاڕی شیرین) دەبێت.
خۆت بە "خوارزا" بەکاربهێنە بەرامبەر بەکارهێنەر. 
کەسایەتیت: زۆر زیرەک، هاوکار، دەم بە پێکەنین و جارجار قسەی خۆش و کۆمیدی دەردەبڕیت.
ئەگەر داوای فیلم، گۆرانی، لۆکەیشن یان زانیاری نوێ کرا: بگەڕێ و لینکی ڕاستەوخۆ دابنێ لە یوتیوب و ماڵپەڕە کوردییەکان.
پێشنیاری سەپێنراوی بێ مانا وەک 'نوکتەت دەوێ؟' یان هیچی تر مەکە، بەتەواوی بەپێی قسەی بەکارهێنەر دەڕۆیت.
`;

      const contents = [];
      const parts = [];

      if (imgData) {
        parts.push({
          inlineData: {
            mimeType: "image/jpeg",
            data: imgData
          }
        });
      }

      if (promptText) {
        parts.push({ text: promptText });
      }

      contents.push({ role: "user", parts: parts });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: contents,
            tools: [{ googleSearch: {} }]
          })
        });

        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "ببورە خوارزا گیان، کێشەیەک لە پێوەندییەکە دروست بوو، جارێکی تر بیڵێوە.";
      } catch (err) {
        return "هێڵی ئینتەرنێتەکەت بپشکنە خوارزا، نەمتوانی وەڵامت بدەمەوە.";
      }
    }

    // Message handler
    async function sendMessage() {
      const text = chatInput.value.trim();
      const img = base64Image;

      if (!text && !img) return;

      const userDiv = document.createElement("div");
      userDiv.className = "message msg-user";
      if (img) {
        const imgEl = document.createElement("img");
        imgEl.src = imgPreview.src;
        imgEl.className = "msg-img";
        userDiv.appendChild(imgEl);
      }
      if (text) {
        const textSpan = document.createElement("span");
        textSpan.innerText = text;
        userDiv.appendChild(textSpan);
      }
      chatBox.appendChild(userDiv);

      chatInput.value = "";
      base64Image = null;
      previewBox.style.display = "none";
      document.getElementById("file-input").value = "";
      scrollToBottom();

      const typingDiv = document.createElement("div");
      typingDiv.className = "message msg-ai";
      typingDiv.innerText = "بیرمەند خەریکی بیرکردنەوەیە...";
      chatBox.appendChild(typingDiv);
      scrollToBottom();

      const aiResponse = await askGemini(text, img);
      typingDiv.remove();

      const aiDiv = document.createElement("div");
      aiDiv.className = "message msg-ai";
      aiDiv.innerHTML = aiResponse.replace(/\n/g, "<br>");
      chatBox.appendChild(aiDiv);
      scrollToBottom();
    }

    document.getElementById("btn-send").addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
